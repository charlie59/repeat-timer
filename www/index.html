<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Repeat Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="idle">
  <main id="app">
    <header>
      <div id="round"></div>
      <button id="settingsBtn" class="icon" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <section id="display">
      <div id="phase">READY</div>
      <button id="time" aria-label="Set time">3:00</button>
    </section>

    <section id="controls">
      <button id="repeatBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span id="repeatLabel">REPEAT OFF</span>
      </button>
      <button id="startBtn">START</button>
    </section>
  </main>

  <!-- Time picker -->
  <section id="picker" class="sheet" hidden>
    <h2>Set time</h2>
    <div class="pickerValue" id="pickerValue">3:00</div>
    <div class="steppers">
      <div class="stepper">
        <button data-step="-60">−</button><span>MIN</span><button data-step="60">+</button>
      </div>
      <div class="stepper">
        <button data-step="-5">−</button><span>SEC</span><button data-step="5">+</button>
      </div>
    </div>
    <div class="chips">
      <button data-set="60">1</button>
      <button data-set="180">3</button>
      <button data-set="420">7</button>
      <button data-set="660">11</button>
      <button data-set="1860">31</button>
    </div>
    <div class="chipsLabel">minutes</div>
    <button class="done" data-close>DONE</button>
  </section>

  <!-- Settings -->
  <section id="settings" class="sheet" hidden>
    <h2>Settings</h2>

    <div class="row">
      <div class="rowLabel">Rest between rounds</div>
      <div class="stepper small">
        <button data-rest="-1">−</button><span id="restValue">5 s</span><button data-rest="1">+</button>
      </div>
    </div>

    <div class="row">
      <div class="rowLabel">Sound</div>
      <button class="toggle" id="soundToggle" aria-pressed="true">ON</button>
    </div>

    <div class="row column">
      <div class="rowLabel">Sound type <small>(tap to hear)</small></div>
      <div class="segmented" id="soundType">
        <button data-sound="chime">Chime</button>
        <button data-sound="bowl">Bowl</button>
        <button data-sound="beep">Beep</button>
      </div>
    </div>

    <div class="row">
      <div class="rowLabel">Vibration</div>
      <button class="toggle" id="vibrateToggle" aria-pressed="true">ON</button>
    </div>

    <button class="done" data-close>DONE</button>
    <div class="credit">Repeat Timer 1.0<br>from TexIt Services LLC</div>
  </section>

  <script src="app.js"></script>
</body>
</html>
